<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F5C3B" />
      <stop offset="100%" stop-color="#143e27" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1602A" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Protective Halo Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="8" stroke-dasharray="16 12" />

  <!-- Interlocking Chain of Custody & Bio-Shield Emblem -->
  <g filter="url(#dropShadow)">
    <!-- Central Shield -->
    <path d="M 256 96 L 384 152 L 384 276 C 384 360 256 424 256 424 C 256 424 128 360 128 276 L 128 152 Z" 
          fill="url(#accentGrad)" 
          stroke="#FFFFFF" 
          stroke-width="12" 
          stroke-linejoin="round" />

    <!-- Medical / Chain-of-Custody Cross & Node -->
    <!-- Vertical Bar -->
    <rect x="236" y="176" width="40" height="128" rx="12" fill="#FFFFFF" />
    <!-- Horizontal Bar -->
    <rect x="192" y="220" width="128" height="40" rx="12" fill="#FFFFFF" />

    <!-- Center Verifiable Core Node -->
    <circle cx="256" cy="240" r="18" fill="#1F5C3B" stroke="#FFFFFF" stroke-width="6" />

    <!-- Verifiable Checkmark Emblem below -->
    <path d="M 216 320 L 244 348 L 296 296" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
