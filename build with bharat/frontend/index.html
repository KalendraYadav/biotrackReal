<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14462a" />
    <meta name="description" content="BioTrace — Digital Chain-of-Custody & Intelligent Biomedical Waste Compliance" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600;700&display=swap" rel="stylesheet">
    <title>BioTrace — Biomedical Waste Compliance & Risk Monitoring</title>
  </head>
  <body class="bg-cream-50 text-steel-950 antialiased font-sans">
    <script>
      if (window.location.protocol === 'file:' || !window.location.host) {
        document.body.innerHTML = `
          <div style="min-height:100vh; background:#0a0f1d; color:#f8fafc; font-family:system-ui,-apple-system,sans-serif; display:flex; align-items:center; justify-content:center; padding:24px;">
            <div style="max-width:620px; background:#1e293b; border:2px solid #ef4444; border-radius:12px; padding:32px; box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);">
              <div style="display:inline-block; padding:8px 14px; background:#dc2626; color:#fff; border-radius:6px; font-weight:700; font-size:14px; text-transform:uppercase; letter-spacing:1px; margin-bottom:16px;">
                Critical Origin Error
              </div>
              <h1 style="font-size:24px; font-weight:700; margin:0 0 12px 0; color:#f87171;">
                BioTrace Cannot Be Opened via file:// or Double-Click
              </h1>
              <p style="font-size:15px; line-height:1.6; color:#cbd5e1; margin-bottom:20px;">
                You have opened this file directly from your filesystem. Modern web browsers enforce strict security sandboxes on <code>file://</code> URLs that <strong>permanently block</strong>:
              </p>
              <ul style="font-size:14px; line-height:1.8; color:#94a3b8; margin-bottom:24px; padding-left:20px;">
                <li><strong style="color:#f1f5f9;">Camera Access:</strong> Live QR code scanning and evidence photo capture fail.</li>
                <li><strong style="color:#f1f5f9;">Geolocation API:</strong> GPS coordinate tagging and geofence verification are disabled.</li>
                <li><strong style="color:#f1f5f9;">Backend API Communication:</strong> Browser CORS security prohibits HTTP calls to <code>http://localhost:5000</code>.</li>
              </ul>
              <div style="background:#0f172a; border-left:4px solid #38bdf8; padding:16px; border-radius:4px; font-family:monospace; font-size:13px; color:#e2e8f0;">
                <p style="margin:0 0 6px 0; color:#94a3b8;">Correct way to run BioTrace:</p>
                <div style="color:#34d399; font-weight:bold;">1. Open terminal in project folder</div>
                <div style="color:#34d399; font-weight:bold; margin-top:4px;">2. Run: npm run dev</div>
                <div style="color:#38bdf8; margin-top:4px;">3. Navigate to: http://localhost:5173</div>
              </div>
            </div>
          </div>
        `;
        throw new Error('BioTrace blocked on file:// protocol');
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
