services:
  postgres:
    image: postgres:17-alpine
    container_name: biotrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nidusclean
    ports:
      - "5435:5432"
    volumes:
      - biotrace_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nidusclean"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  biotrace_pg_data:
    name: biotrace_pg_data
